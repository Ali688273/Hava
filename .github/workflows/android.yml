name: Build Weather APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Signed Release APK
      run: |
        gradle assembleRelease \
        -Pandroid.injected.signing.store.file=upload-keystore.jks \
        -Pandroid.injected.signing.store.password=android123456 \
        -Pandroid.injected.signing.key.alias=weatherkey \
        -Pandroid.injected.signing.key.password=android123456

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: weather-app-signed
        path: app/build/outputs/apk/release/app-release.apk
