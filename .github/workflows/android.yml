name: Build Weather APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Keystore Automatically
      run: |
        keytool -genkey -v -keystore app/upload-keystore.jks \
        -alias weatherkey -keyalg RSA -keysize 2048 -validity 10000 \
        -storepass android123456 -keypass android123456 \
        -dname "CN=Weather App, OU=Development, O=Android, L=Tehran, C=IR"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: weather-app-signed
        path: app/build/outputs/apk/release/app-release.apk
